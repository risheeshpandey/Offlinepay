input {
  file {
    path => ["/input/*.log"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/offlinepay-sincedb"
    codec => json
    mode => "tail"
  }
}
filter {
  if "_jsonparsefailure" in [tags] { drop { } }
  # Keep a small searchable schema. Do not ingest headers, cookies or arbitrary MDC.
  prune {
    whitelist_names => ["^@timestamp$", "^@version$", "^message$", "^service$", "^level$", "^logger_name$", "^thread_name$", "^requestId$", "^traceId$", "^spanId$", "^stack_trace$", "^tags$"]
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "offlinepay-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
    ecs_compatibility => disabled
  }
}
