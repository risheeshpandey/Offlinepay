groups:
  - name: offlinepay
    rules:
      - alert: OfflinePayTargetDown
        expr: up{job="offlinepay"} == 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'OfflinePay scrape target unavailable for one minute'}
      - alert: OfflinePayParkedOutbox
        expr: offlinepay_outbox_events{status="FAILED"} > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'An outbox event needs operator recovery'}
      - alert: OfflinePayDeadLetter
        expr: offlinepay_dead_letters_open > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'An archived dead-letter event needs review'}
      - alert: OfflinePayMetricsRefreshFailed
        expr: increase(offlinepay_monitoring_refresh_failures_total[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: 'Database queue gauges may be stale'}
      - alert: OfflinePayHttpErrors
        expr: sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum by (application) (rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'More than 5 percent of observed HTTP responses are server errors'}
