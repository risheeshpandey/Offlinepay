# Disposable CI-only stack. The orchestrator always assigns a unique project name.
# No user .env, existing volumes, data imports or fixed container names are used.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: offlinepay_load
      POSTGRES_USER: offlinepay
      POSTGRES_PASSWORD: ${CAPACITY_POSTGRES_PASSWORD:?Generated by the CI runner}
    ports: ["127.0.0.1:${CAPACITY_DB_PORT}:5432"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offlinepay -d offlinepay_load"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:${CAPACITY_REDIS_PORT}:6379"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:${CAPACITY_KAFKA_PORT}:9094"]
    mem_limit: 1536m
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx512m
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9094,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${CAPACITY_KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
